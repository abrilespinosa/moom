<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Moom — Autobuses de Madrid en tiempo real</title>

  <!-- Icono de la pestaña. El SVG es el que usan Chrome y Firefox: al ser
       vectorial se ve nítido a cualquier tamaño. El PNG de 64px queda de
       respaldo para los navegadores que todavía no admiten favicon en SVG.
       Si tras cambiarlo sigue saliendo el de antes, es la caché de iconos
       del navegador: recarga forzada (Cmd+Shift+R) o pestaña nueva. -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />

  <!-- Hoja de estilos de Leaflet, necesaria para que el mapa se vea bien -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Nuestros propios estilos, separados en su propio archivo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANEL IZQUIERDO: contiene dos vistas, solo una visible a la vez -->
  <div id="panel">

    <!-- Banda naranja de marca. El logo es el nombre en blanco sobre fondo
         transparente, así que el color sale del CSS y no del archivo. -->
    <div id="panel-header">
      <!-- El logo va dentro del h1 y con alt: sigue siendo el título de la
           página para un lector de pantalla, aunque se vea como imagen. -->
      <h1><img id="logo" src="assets/logo.svg" alt="Moom" /></h1>
    </div>

    <!-- Fuera de la banda naranja: es texto que cambia con la vista
         (buscador / recorrido / llegadas), no parte del logotipo. -->
    <p id="subtitulo-header">Busca una parada o una línea</p>

    <!-- VISTA 1: buscador -->
    <div id="vista-busqueda">
      <!-- Filtros por modo. Cada uno lleva el mismo icono con el que se
           dibuja esa fuente en el mapa, para que la correspondencia entre
           botón y marcador se vea sin explicarla. -->
      <div id="filtros-fuente">
        <button class="filtro-boton activo" data-filtro="todos" title="Todos los modos">
          <span class="filtro-icono">
            <!-- "Todos" no tiene icono propio de transporte, así que usa una
                 cuadrícula. Va en SVG y no en PNG para que herede el color
                 del botón cuando está activo. -->
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="3" y="3" width="8" height="8" rx="2" />
              <rect x="13" y="3" width="8" height="8" rx="2" />
              <rect x="3" y="13" width="8" height="8" rx="2" />
              <rect x="13" y="13" width="8" height="8" rx="2" />
            </svg>
          </span>
          <span class="filtro-etiqueta">Todos</span>
        </button>

        <button class="filtro-boton" data-filtro="EMT" title="Autobús urbano (EMT)">
          <span class="filtro-icono"><img src="assets/bus-urbano.png" alt="" /></span>
          <span class="filtro-etiqueta">Urbano</span>
        </button>

        <button class="filtro-boton" data-filtro="CRTM" title="Autobús interurbano (CRTM)">
          <span class="filtro-icono"><img src="assets/bus-interurbano.png" alt="" /></span>
          <span class="filtro-etiqueta">Interurbano</span>
        </button>

        <button class="filtro-boton" data-filtro="METRO" title="Metro de Madrid">
          <span class="filtro-icono"><img src="assets/metro.png" alt="" /></span>
          <span class="filtro-etiqueta">Metro</span>
        </button>
      </div>
      <div style="padding: 12px 16px 0 16px;">
        <input
          type="text"
          id="input-buscar"
          placeholder="Buscar parada o línea..."
        />
      </div>
      <ul id="lista-resultados"></ul>
    </div>

    <!-- VISTA 2: recorrido de una línea (oculta al inicio) -->
    <div id="vista-linea">
      <div id="cabecera-linea">
        <button id="boton-volver-linea" class="boton-volver">← Volver a buscar</button>

        <div id="tarjeta-linea">
          <span id="distintivo-linea" class="tarjeta-linea"></span>
          <div id="datos-linea">
            <div id="nombre-linea"></div>
            <div id="fuente-linea"></div>
          </div>
          <!-- El icono y el estado de la estrella los pone app.js, que es
               quien sabe si esta línea está guardada. -->
          <button id="boton-favorito-linea" class="boton-favorito"></button>
        </div>

        <!-- Un botón por sentido, generado desde app.js -->
        <div id="sentidos-linea"></div>
      </div>

      <div id="titulo-recorrido"></div>
      <ul id="lista-recorrido"></ul>
    </div>

    <!-- VISTA 3: llegadas a la parada seleccionada (oculta al inicio) -->
    <div id="vista-llegadas">
      <div id="cabecera-llegadas">
        <button id="boton-volver" class="boton-volver">← Volver</button>

        <!-- Tarjeta con la identidad de la parada: icono del modo, nombre,
             código y las líneas que pasan por ella. Todo se rellena desde
             app.js y se vacía al cambiar de parada. -->
        <div id="tarjeta-parada">
          <img id="icono-parada-actual" alt="" />
          <div id="datos-parada">
            <div id="nombre-parada-actual"></div>
            <div id="codigo-parada-actual"></div>
            <div id="chips-lineas"></div>
          </div>
          <button id="boton-favorito-parada" class="boton-favorito"></button>
        </div>
      </div>

      <div id="titulo-seccion"></div>
      <ul id="lista-llegadas"></ul>
    </div>

  </div>

  <!-- Divisor entre el panel y el mapa. Se arrastra para decidir cuánto
       ocupa cada uno. Con role="separator" y tabindex también se puede
       mover con las flechas del teclado. -->
  <div
    id="divisor"
    role="separator"
    aria-orientation="vertical"
    aria-label="Ajustar el ancho del panel"
    title="Arrastra para ajustar el panel (doble clic para restablecer)"
    tabindex="0"
  ></div>

  <!-- PANEL DERECHO: el mapa -->
  <div id="mapa"></div>

  <!-- Botón flotante sobre el mapa, no dentro del panel -->
  <button id="boton-ubicacion" title="Mi ubicación">📍</button>

  <!-- Librería de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Nuestra propia lógica, separada en su propio archivo.
       Va al final del body para que, cuando se ejecute, los elementos
       del HTML (input, mapa, etc.) ya existan en la página. -->
  <script src="app.js"></script>

</body>
</html>
