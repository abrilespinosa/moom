<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Moom — Autobuses de Madrid en tiempo real</title>

  <!-- Hoja de estilos de Leaflet, necesaria para que el mapa se vea bien -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Nuestros propios estilos, separados en su propio archivo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANEL IZQUIERDO: contiene dos vistas, solo una visible a la vez -->
  <div id="panel">

    <div id="panel-header">
      <h1>🚌 Moom</h1>
      <p id="subtitulo-header">Busca una parada para ver sus llegadas</p>
    </div>

    <!-- VISTA 1: buscador -->
    <div id="vista-busqueda">
      <div id="filtros-fuente">
        <button class="filtro-boton activo" data-filtro="todos">Todos</button>
        <button class="filtro-boton" data-filtro="EMT">Urbano</button>
        <button class="filtro-boton" data-filtro="CRTM">Interurbano</button>
        <button class="filtro-boton" data-filtro="METRO">Metro</button>
      </div>
      <div style="padding: 12px 16px 0 16px;">
        <input
          type="text"
          id="input-buscar"
          placeholder="Buscar parada por nombre o número..."
        />
      </div>
      <ul id="lista-resultados"></ul>
    </div>

    <!-- VISTA 2: llegadas a la parada seleccionada (oculta al inicio) -->
    <div id="vista-llegadas">
      <div style="padding: 12px 16px 0 16px;">
        <button id="boton-volver">← Volver a buscar</button>
        <div id="nombre-parada-actual"></div>
      </div>
      <ul id="lista-llegadas"></ul>
    </div>

  </div>

  <!-- PANEL DERECHO: el mapa -->
  <div id="mapa"></div>

  <!-- Botón flotante sobre el mapa, no dentro del panel -->
  <button id="boton-ubicacion" title="Mi ubicación">📍</button>

  <!-- Librería de Leaflet -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Nuestra propia lógica, separada en su propio archivo.
       Va al final del body para que, cuando se ejecute, los elementos
       del HTML (input, mapa, etc.) ya existan en la página. -->
  <script src="app.js"></script>

</body>
</html>
