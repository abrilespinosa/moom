<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <!-- Sin esto el móvil renderiza la página como si fuera de escritorio y
       luego la encoge: el panel quedaba en unos 100px y el mapa inservible.
       viewport-fit=cover deja que la hoja inferior llegue hasta el borde en
       los móviles con muesca; el hueco de la barra de gestos se recupera
       después con safe-area-inset-bottom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Moom — Autobuses de Madrid en tiempo real</title>

  <!-- Inter, la tipografía de la identidad de marca. Servida desde este mismo
       dominio y no desde fonts.googleapis.com: así la visita no le manda su
       dirección IP a Google solo por abrir el mapa. El detalle está en
       tipografia.css. -->
  <link rel="stylesheet" href="tipografia.css" />

  <!-- La fuente se precarga porque la usa TODO el texto de la página: sin
       esto el navegador no se entera de que la necesita hasta haber
       descargado y leído tipografia.css, y ese retraso se ve como un cambio
       de letra a media carga. Solo el subconjunto latino, que es el que se
       usa siempre; el extendido se pide únicamente si hace falta. -->
  <link
    rel="preload"
    href="assets/fuentes/inter-latin.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />

  <!-- Icono de la pestaña. El SVG es el que usan Chrome y Firefox: al ser
       vectorial se ve nítido a cualquier tamaño. El PNG de 64px queda de
       respaldo para los navegadores que todavía no admiten favicon en SVG.
       Si tras cambiarlo sigue saliendo el de antes, es la caché de iconos
       del navegador: recarga forzada (Cmd+Shift+R) o pestaña nueva. -->
  <!-- Manifiesto: permite añadir Moom a la pantalla de inicio y abrirla sin
       la barra del navegador. Para algo que se consulta a diario de pie en la
       calle, ese atajo cambia bastante el uso. -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f5a623" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />

  <!-- Leaflet, servido desde aquí y no desde unpkg. Mismo motivo que la
       tipografía: cada visita le mandaba su IP a un CDN ajeno solo por
       cargar el mapa. Ahora el único tercero que queda es CARTO, y ese es
       inevitable porque ES el mapa.

       Los archivos están en assets/leaflet/, con su licencia BSD-2 al lado
       (la exige al redistribuir, y servirlo desde una web lo es). Las
       imágenes van en assets/leaflet/images/ porque el CSS las referencia
       con rutas relativas a sí mismo: si se mueven, salen 404 silenciosos. -->
  <link rel="stylesheet" href="assets/leaflet/leaflet.css" />

  <!-- Nuestros propios estilos, separados en su propio archivo -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PANEL IZQUIERDO: contiene dos vistas, solo una visible a la vez -->
  <main id="panel">

    <!-- Banda naranja de marca. El logo es el nombre en blanco sobre fondo
         transparente, así que el color sale del CSS y no del archivo. -->
    <header id="panel-header">
      <!-- El logo va dentro del h1 y con alt: sigue siendo el título de la
           página para un lector de pantalla, aunque se vea como imagen. -->
      <h1><img id="logo" src="assets/logo.svg" alt="Moom" /></h1>
    </header>

    <!-- Fuera de la banda naranja: es texto que cambia con la vista
         (buscador / recorrido / llegadas), no parte del logotipo. -->
    <p id="subtitulo-header">Busca una parada o una línea</p>

    <!-- Aviso de que los datos no se están pudiendo refrescar. Va aquí, por
         encima de las tres vistas, porque el fallo puede ocurrir en
         cualquiera de ellas. role="status" hace que un lector de pantalla lo
         anuncie al aparecer sin robar el foco. -->
    <div id="aviso-conexion" role="status" hidden></div>

    <!-- Avisos de servicio de la EMT. Oculto mientras no haya ninguno: un
         botón permanente que casi siempre no lleva a nada deja de mirarse. -->
    <button id="boton-incidencias" type="button" hidden></button>

    <!-- VISTA 1: buscador -->
    <div id="vista-busqueda">
      <!-- Filtros por modo. Cada uno lleva el mismo icono con el que se
           dibuja esa fuente en el mapa, para que la correspondencia entre
           botón y marcador se vea sin explicarla. -->
      <div id="filtros-fuente">
        <button class="filtro-boton activo" data-filtro="todos" title="Todos los modos">
          <span class="filtro-icono">
            <!-- "Todos" no tiene icono propio de transporte, así que usa una
                 cuadrícula. Va en SVG y no en PNG para que herede el color
                 del botón cuando está activo. -->
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <rect x="3" y="3" width="8" height="8" rx="2" />
              <rect x="13" y="3" width="8" height="8" rx="2" />
              <rect x="3" y="13" width="8" height="8" rx="2" />
              <rect x="13" y="13" width="8" height="8" rx="2" />
            </svg>
          </span>
          <span class="filtro-etiqueta">Todos</span>
        </button>

        <button class="filtro-boton" data-filtro="EMT" title="Autobús urbano (EMT)">
          <span class="filtro-icono"><img src="assets/bus-urbano.png" alt="" /></span>
          <span class="filtro-etiqueta">Urbano</span>
        </button>

        <button class="filtro-boton" data-filtro="CRTM" title="Autobús interurbano (CRTM)">
          <span class="filtro-icono"><img src="assets/bus-interurbano.png" alt="" /></span>
          <span class="filtro-etiqueta">Interurbano</span>
        </button>

        <button class="filtro-boton" data-filtro="METRO" title="Metro de Madrid">
          <span class="filtro-icono"><img src="assets/metro.png" alt="" /></span>
          <span class="filtro-etiqueta">Metro</span>
        </button>

        <!-- Solo el Metro publica accesibilidad por estación, así que este
             filtro deja a la vista únicamente estaciones de Metro. No se
             llama "Metro accesible" porque lo que se busca es la propiedad,
             no la red. -->
        <button class="filtro-boton" data-filtro="accesibles"
                title="Estaciones con ascensor o rampa">
          <span class="filtro-icono">
            <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"
                 fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13" cy="4" r="1.6" />
              <path d="M11.5 8v5h5" />
              <path d="M16.5 13l2 5" />
              <path d="M15.5 15.5a5 5 0 1 1-5.5-4" />
            </svg>
          </span>
          <span class="filtro-etiqueta">Accesibles</span>
        </button>
      </div>
      <div style="padding: 12px 16px 0 16px;">
          <label class="solo-lector" for="input-buscar">
            Buscar una parada o una línea
          </label>
          <input
            type="text"
            id="input-buscar"
            placeholder="Buscar parada o línea..."
            autocomplete="off"
          />
      </div>
      <ul id="lista-resultados"></ul>
    </div>

    <!-- VISTA 2: recorrido de una línea (oculta al inicio) -->
    <div id="vista-linea">
      <div id="cabecera-linea">
        <button id="boton-volver-linea" class="boton-volver">← Volver a buscar</button>

        <div id="tarjeta-linea">
          <span id="distintivo-linea" class="tarjeta-linea"></span>
          <div id="datos-linea">
            <div id="nombre-linea"></div>
            <div id="fuente-linea"></div>
          </div>
          <!-- El icono y el estado de la estrella los pone app.js, que es
               quien sabe si esta línea está guardada. -->
          <button id="boton-favorito-linea" class="boton-favorito"></button>
        </div>

        <!-- Un botón por sentido, generado desde app.js -->
        <div id="sentidos-linea"></div>
      </div>

      <!-- Horarios de paso. Plegado por defecto: quien abre una línea
           normalmente quiere ver por dónde pasa, no la tabla entera; y en
           una interurbana esa tabla son cincuenta filas. -->
      <details id="horarios-linea">
        <summary>Horarios de paso</summary>
        <div id="contenido-horarios"></div>
      </details>

      <div id="titulo-recorrido"></div>
      <ul id="lista-recorrido"></ul>
    </div>

    <!-- VISTA 3: llegadas a la parada seleccionada (oculta al inicio) -->
    <div id="vista-llegadas">
      <div id="cabecera-llegadas">
        <button id="boton-volver" class="boton-volver">← Volver</button>

        <!-- Tarjeta con la identidad de la parada: icono del modo, nombre,
             código y las líneas que pasan por ella. Todo se rellena desde
             app.js y se vacía al cambiar de parada. -->
        <div id="tarjeta-parada">
          <img id="icono-parada-actual" alt="" />
          <div id="datos-parada">
            <div id="nombre-parada-actual"></div>
            <div id="codigo-parada-actual"></div>
            <div id="chips-lineas"></div>
          </div>
          <button id="boton-favorito-parada" class="boton-favorito"></button>
        </div>
      </div>

      <div id="titulo-seccion"></div>
      <ul id="lista-llegadas"></ul>
    </div>

    <!-- VISTA 4: incidencias (oculta al inicio) -->
    <div id="vista-incidencias">
      <button id="boton-volver-incidencias" class="boton-volver">← Volver</button>
      <div id="titulo-incidencias"></div>
      <ul id="lista-incidencias"></ul>
    </div>

    <!-- Va fuera de las tres vistas, así que aparece bajo la que esté activa
         en cada momento sin tener que repetirlo tres veces. Deliberadamente
         discreto: es un enlace que casi nadie va a pulsar, pero que tiene que
         estar y ser fácil de encontrar cuando se busca. -->
    <p id="pie-legal">
      <a href="privacidad.html">Privacidad y condiciones de uso</a>
    </p>

  </main>

  <!-- Divisor entre el panel y el mapa. Se arrastra para decidir cuánto
       ocupa cada uno. Con role="separator" y tabindex también se puede
       mover con las flechas del teclado. -->
  <div
    id="divisor"
    role="separator"
    aria-orientation="vertical"
    aria-label="Ajustar el ancho del panel"
    title="Arrastra para ajustar el panel (doble clic para restablecer)"
    tabindex="0"
  ></div>

  <!-- PANEL DERECHO: el mapa -->
  <div id="mapa"></div>

  <!-- Botón flotante sobre el mapa, no dentro del panel -->
  <button id="boton-ubicacion" title="Mi ubicación">📍</button>

  <!-- Librería de Leaflet -->
  <script src="assets/leaflet/leaflet.js"></script>

  <!-- Nuestra propia lógica, separada en su propio archivo.
       Va al final del body para que, cuando se ejecute, los elementos
       del HTML (input, mapa, etc.) ya existan en la página. -->
  <script src="app.js"></script>

</body>
</html>
