[pytest]
# La raíz del proyecto, en el path de importación.
#
# Sin esto, "pytest" a secas falla al importar backend.*: pytest no añade el
# directorio actual, a diferencia de "python -m pytest". Y la aplicación
# trata backend/ como un paquete (main.py hace "from backend.x import ..."),
# igual que uvicorn, que también se lanza desde aquí.
#
# Va en su propio archivo y no en pyproject.toml a propósito: ese lo genera
# Vercel en cada build a partir de requirements.txt, así que lo que se
# escriba allí se pierde.
pythonpath = .

testpaths = tests

# Los tests no salen a la red: comprobado ejecutándolos con las conexiones
# bloqueadas. Si alguno empieza a tardar, es que se ha colado una llamada a
# EMT o al CRTM y ese test dejará de valer en cuanto una de las dos falle.
addopts = -q -m "not navegador"

# Los tests de frontend abren Chrome, así que tardan segundos y no décimas.
# Se quedan FUERA de "pytest" a secas para no romper la garantía del resto de
# la suite: rápida y sin red. Se ejecutan aparte con "pytest -m navegador".
markers =
    navegador: abre Chrome en modo headless; lento. No se ejecuta por defecto.
